[project]
name = "mining-daily"
version = "0.1.0"
description = "MCP-based Mineral Rights Daily Brief Agent — 3 MCP servers + 1 LangGraph agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "langgraph>=0.2.60",
    "openai>=1.60.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "typer>=0.15",
    "rich>=13.9",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
mining-news-mcp = "mining_daily.servers.news_server:main"
mineral-pdf-mcp = "mining_daily.servers.pdf_server:main"
lme-price-mcp = "mining_daily.servers.price_server:main"
mining-daily = "mining_daily.agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mining_daily"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
